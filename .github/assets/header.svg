<svg viewBox="0 0 1000 300" width="1000" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NOOOBTIMEX — Wongsaphat Puangsorn, Software Developer">
	<style>
		.display {
			font-family: "Avenir Next Condensed", "Bahnschrift", "Arial Narrow", Impact, "Liberation Sans Narrow", sans-serif;
			font-weight: 700;
			letter-spacing: 3px;
		}
		.mono {
			font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
		}
		.title {
			font-size: 104px;
		}
		.glitch-m,
		.glitch-c {
			opacity: 0;
		}
		.glitch-m {
			animation: glitch-m 3.7s infinite steps(1, end);
		}
		.glitch-c {
			animation: glitch-c 3.7s infinite steps(1, end);
		}
		.glitch-base {
			animation: glitch-base 3.7s infinite steps(1, end);
		}
		@keyframes glitch-m {
			0%, 86%, 100% { opacity: 0; transform: translate(0, 0); }
			87% { opacity: 0.85; transform: translate(-6px, 2px); }
			89% { opacity: 0.6; transform: translate(5px, -2px); }
			91% { opacity: 0.75; transform: translate(-3px, 1px); }
			93% { opacity: 0; }
		}
		@keyframes glitch-c {
			0%, 87%, 100% { opacity: 0; transform: translate(0, 0); }
			88% { opacity: 0.85; transform: translate(6px, -2px); }
			90% { opacity: 0.6; transform: translate(-5px, 2px); }
			92% { opacity: 0.75; transform: translate(3px, -1px); }
			94% { opacity: 0; }
		}
		@keyframes glitch-base {
			0%, 86%, 100% { transform: translate(0, 0); }
			88% { transform: translate(3px, -1px); }
			90% { transform: translate(-3px, 1px); }
			92% { transform: translate(0, 0); }
		}
		.scan {
			animation: scan-drift 0.6s linear infinite;
		}
		@keyframes scan-drift {
			from { transform: translateY(0); }
			to { transform: translateY(4px); }
		}
		.blink {
			animation: blink 1.4s infinite steps(1, end);
		}
		@keyframes blink {
			0%, 70% { opacity: 1; }
			71%, 100% { opacity: 0.2; }
		}
		.bars {
			animation: bars-pulse 2.8s ease-in-out infinite;
		}
		@keyframes bars-pulse {
			0%, 100% { opacity: 0.9; }
			50% { opacity: 0.35; }
		}
	</style>

	<defs>
		<clipPath id="panel-clip">
			<polygon points="24,2 998,2 998,274 974,298 2,298 2,26" />
		</clipPath>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0V40" fill="none" stroke="#00F0FF" stroke-opacity="0.06" stroke-width="1" />
		</pattern>
		<pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
			<rect width="4" height="1.5" fill="#000000" opacity="0.28" />
		</pattern>
	</defs>

	<!-- panel surface -->
	<polygon points="24,2 998,2 998,274 974,298 2,298 2,26" fill="#050507" />

	<g clip-path="url(#panel-clip)">
		<!-- cyber grid -->
		<rect x="0" y="0" width="1000" height="300" fill="url(#grid)" />

		<!-- code label -->
		<text class="mono" x="60" y="62" font-size="16" letter-spacing="6" fill="#00F0FF">// PORTFOLIO_V2.077</text>

		<!-- system status, top right -->
		<g class="mono" font-size="12" letter-spacing="2">
			<text x="940" y="40" text-anchor="end" fill="#39FF14" class="blink">● SYS.STATUS // ONLINE</text>
			<text x="940" y="60" text-anchor="end" fill="#E6FBFF" opacity="0.45">NET // GITHUB.COM/NOOOBTIMEX</text>
		</g>

		<!-- glitch title -->
		<g class="display title">
			<text class="glitch-m" x="56" y="158" fill="#FF003C">NOOOBTIMEX</text>
			<text class="glitch-c" x="56" y="158" fill="#00F0FF">NOOOBTIMEX</text>
			<text class="glitch-base" x="56" y="158" fill="#FCEE0A">NOOOBTIMEX</text>
		</g>

		<!-- divider -->
		<line x1="60" y1="184" x2="940" y2="184" stroke="#1B2A33" stroke-width="2" />
		<line x1="60" y1="184" x2="220" y2="184" stroke="#FCEE0A" stroke-width="2" />

		<!-- subtitle -->
		<rect x="60" y="206" width="6" height="30" fill="#FCEE0A" />
		<text class="mono" x="80" y="228" font-size="19" letter-spacing="4" fill="#E6FBFF">WONGSAPHAT PUANGSORN // SOFTWARE DEVELOPER</text>

		<!-- tagline -->
		<text class="mono" x="80" y="258" font-size="13" letter-spacing="2" fill="#E6FBFF" opacity="0.5">TYPESCRIPT ECOSYSTEMS · HIGH-PERFORMANCE SYSTEM DESIGN</text>

		<!-- data bars, right side -->
		<g class="bars">
			<rect x="846" y="120" width="10" height="44" fill="#FCEE0A" />
			<rect x="862" y="104" width="10" height="60" fill="#00F0FF" />
			<rect x="878" y="132" width="10" height="32" fill="#FF003C" />
			<rect x="894" y="92" width="10" height="72" fill="#FCEE0A" />
			<rect x="910" y="116" width="10" height="48" fill="#00F0FF" />
			<rect x="926" y="140" width="10" height="24" fill="#B026FF" />
		</g>

		<!-- id tag, bottom right -->
		<rect x="784" y="254" width="150" height="26" fill="#FCEE0A" />
		<text class="mono" x="859" y="271" font-size="12" letter-spacing="2" text-anchor="middle" fill="#050507">ID // NOOOBTIMEX</text>

		<!-- scanlines overlay -->
		<g class="scan">
			<rect x="0" y="-8" width="1000" height="316" fill="url(#scanlines)" />
		</g>
	</g>

	<!-- panel border -->
	<polygon points="24,2 998,2 998,274 974,298 2,298 2,26" fill="none" stroke="#1B2A33" stroke-width="2" />

	<!-- HUD corner brackets -->
	<path d="M30 52 V32 H50" fill="none" stroke="#00F0FF" stroke-width="2.5" />
	<path d="M968 248 V268 H948" fill="none" stroke="#00F0FF" stroke-width="2.5" />
</svg>
