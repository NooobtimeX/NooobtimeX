name: README assets

on:
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/readme/**'
      - 'common/data/**'
      - 'lib/github.ts'
      - '.github/workflows/readme-assets.yml'

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run readme:assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed assets
        run: |
          if [ -n "$(git status --porcelain .github/assets)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add .github/assets
            git commit -m 'chore(readme): refresh generated assets [skip ci]'
            git push
          else
            echo 'Assets unchanged — nothing to commit.'
          fi
